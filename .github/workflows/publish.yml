name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the OIDC token replaces an npm token, and signs the provenance
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 11.15.0+
      - run: npm install -g npm@11.21.0
      # prepublishOnly runs `claude plugin validate` and `claude plugin test`
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: tag matches the versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in package.json .claude-plugin/plugin.json; do
            test "$(node -p "require('./$f').version")" = "$v" || { echo "$f is not $v"; exit 1; }
          done
          test "$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].source.version")" = "$v" \
            || { echo "marketplace.json does not pin $v"; exit 1; }
      # the trusted publisher is stage-only: this queues the release, and it goes live only once a
      # maintainer approves it with 2FA on npmjs.com (or `npm stage approve <id>`)
      - run: npm stage publish --provenance --access public
